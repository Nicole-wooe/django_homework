{% extends 'base.html' %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<h1>{{ product.name }}</h1>

{% if product.image %}
    <img src="{{ product.image.url }}"
         alt="{{ product.name }}"
         class="img-fluid mb-3"
         style="max-width: 400px;">
{% endif %}

<p>{{ product.description }}</p>

<p>
    <strong>Цена:</strong> {{ product.price }}
</p>

<a href="/" class="btn btn-primary">
    На главную
</a>

{% endblock %}
